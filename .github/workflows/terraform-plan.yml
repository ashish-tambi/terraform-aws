# =============================================================================
# Terraform Plan - Runs on Pull Requests
# Shows what changes will be made, posts plan as PR comment
# =============================================================================

name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  id-token: write    # Required for OIDC
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.5.7"
  AWS_REGION: "ap-south-1"

jobs:
  # ---------------------------------------------------------------------------
  # Detect which environments changed
  # ---------------------------------------------------------------------------
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.changes.outputs.environments }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed environments
        id: changes
        run: |
          # If modules changed, all environments are affected
          if git diff --name-only origin/main...HEAD | grep -q "^modules/"; then
            echo 'environments=["dev","staging","prod"]' >> $GITHUB_OUTPUT
          else
            # Only plan environments that have changes
            ENVS=$(git diff --name-only origin/main...HEAD \
              | grep "^environments/" \
              | cut -d'/' -f2 \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "environments=${ENVS}" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Plan each affected environment
  # ---------------------------------------------------------------------------
  plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.environments != '[]'
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        working-directory: environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "plan_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/${{ matrix.environment }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;

            const body = `### 📋 Terraform Plan — \`${{ matrix.environment }}\`

            \`\`\`hcl
            ${truncated}
            \`\`\`

            *Triggered by @${{ github.actor }} in PR #${{ github.event.pull_request.number }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.plan_exit_code != '0'
        run: exit 1
