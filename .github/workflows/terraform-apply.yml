# =============================================================================
# Terraform Apply - Runs on merge to main
# Applies changes in order: dev → staging → prod (with manual approval for prod)
# =============================================================================

name: "Terraform Apply"

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.5.7"
  AWS_REGION: "ap-south-1"

jobs:
  # ---------------------------------------------------------------------------
  # Detect which environments changed
  # ---------------------------------------------------------------------------
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.changes.outputs.dev }}
      staging: ${{ steps.changes.outputs.staging }}
      prod: ${{ steps.changes.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          MODULES_CHANGED=$(echo "$CHANGED" | grep -c "^modules/" || true)

          if [ "$MODULES_CHANGED" -gt 0 ]; then
            echo "dev=true" >> $GITHUB_OUTPUT
            echo "staging=true" >> $GITHUB_OUTPUT
            echo "prod=true" >> $GITHUB_OUTPUT
          else
            echo "dev=$(echo "$CHANGED" | grep -c "^environments/dev/" || true)" >> $GITHUB_OUTPUT
            echo "staging=$(echo "$CHANGED" | grep -c "^environments/staging/" || true)" >> $GITHUB_OUTPUT
            echo "prod=$(echo "$CHANGED" | grep -c "^environments/prod/" || true)" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Apply Dev
  # ---------------------------------------------------------------------------
  apply-dev:
    name: "Apply Dev"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dev != '0'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: environments/dev
        run: terraform apply -input=false -auto-approve

  # ---------------------------------------------------------------------------
  # Apply Staging (after Dev succeeds)
  # ---------------------------------------------------------------------------
  apply-staging:
    name: "Apply Staging"
    runs-on: ubuntu-latest
    needs: [detect-changes, apply-dev]
    if: |
      always() &&
      needs.detect-changes.outputs.staging != '0' &&
      (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped')
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/staging
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: environments/staging
        run: terraform apply -input=false -auto-approve

  # ---------------------------------------------------------------------------
  # Apply Prod (after Staging, requires manual approval via GitHub Environment)
  # ---------------------------------------------------------------------------
  apply-prod:
    name: "Apply Prod"
    runs-on: ubuntu-latest
    needs: [detect-changes, apply-staging]
    if: |
      always() &&
      needs.detect-changes.outputs.prod != '0' &&
      (needs.apply-staging.result == 'success' || needs.apply-staging.result == 'skipped')
    environment: production  # Configure required reviewers in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: environments/prod
        run: terraform apply -input=false -auto-approve
